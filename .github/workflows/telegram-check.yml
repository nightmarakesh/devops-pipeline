name: Telegram check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Send changelog to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --silent --show-error --fail \
            --connect-timeout 15 \
            --max-time 60 \
            --output /tmp/telegram-response.json \
            --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "caption=Проверка DevOps Pipeline: GitHub Actions отправил changelog.md." \
            --form "document=@changelog.md" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

          echo "Файл успешно отправлен в Telegram."