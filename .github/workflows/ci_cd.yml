name: CI/CD

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  security:
    name: Security
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    uses: ./.github/workflows/sec.yml

  tests:
    name: Tests
    needs: security
    uses: ./.github/workflows/test.yml

  version:
    name: Update version
    needs: tests
    runs-on: ubuntu-latest

    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      old_version: ${{ steps.bump.outputs.old_version }}
      update_type: ${{ steps.bump.outputs.update_type }}

    steps:
      - name: Download main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Calculate and save version
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const branch = context.payload.pull_request.head.ref;
            const oldVersion = fs.readFileSync("version", "utf8").trim();

            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(oldVersion)) {
              throw new Error("Invalid version file: " + oldVersion);
            }

            let [major, minor, patch] = oldVersion.split(".").map(Number);
            let updateType;

            if (branch.startsWith("feature/")) {
              minor += 1;
              patch = 0;
              updateType = "minor";
            } else if (branch.startsWith("hotfix/")) {
              patch += 1;
              updateType = "patch";
            } else {
              throw new Error("Unsupported branch: " + branch);
            }

            const newVersion = `${major}.${minor}.${patch}`;
            fs.writeFileSync("version", newVersion + "\n");

            core.setOutput("old_version", oldVersion);
            core.setOutput("new_version", newVersion);
            core.setOutput("update_type", updateType);

            core.info(`${oldVersion} -> ${newVersion} (${updateType})`);

      - name: Commit and push version
        env:
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          UPDATE_TYPE: ${{ steps.bump.outputs.update_type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version
          git commit -m "[$NEW_VERSION] <- [$OLD_VERSION] $UPDATE_TYPE up"
          git push origin HEAD:main

      - name: Add version label
        uses: actions/github-script@v7
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const name = process.env.NEW_VERSION;

            try {
              await github.rest.issues.getLabel({
                owner, repo, name
              });
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color: "1D76DB",
                description: "Application version"
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [name]
            });
            
  changelog:
    name: Update changelog
    needs: version
    runs-on: ubuntu-latest

    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}

    steps:
      - name: Download main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepend release entry
        uses: actions/github-script@v7
        env:
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        with:
          script: |
            const fs = require("fs");
            const version = process.env.NEW_VERSION;
            const pr = context.payload.pull_request;
            const date = new Date().toISOString();

            const previous = fs.existsSync("changelog.md")
              ? fs.readFileSync("changelog.md", "utf8")
              : "";

            const entry = [
              `## ${version}`,
              "",
              `- Date (UTC): ${date}`,
              `- Branch: \`${pr.head.ref}\``,
              `- PR: [#${pr.number}](${pr.html_url})`,
              `- Changes: ${pr.title}`,
              "",
              ""
            ].join("\n");

            fs.writeFileSync("changelog.md", entry + previous);

      - name: Commit and push changelog
        id: commit
        env:
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add changelog.md
          git commit -m "docs: update changelog for $NEW_VERSION"
          git push origin HEAD:main

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add changelog label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const name = "changelog";

            try {
              await github.rest.issues.getLabel({
                owner, repo, name
              });
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color: "5319E7",
                description: "Release changelog updated"
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [name]
            });

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md
          if-no-files-found: error
          retention-days: 30
    
    
  dockerhub:
    name: Publish to Docker Hub
    needs: [version, changelog]
    runs-on: ubuntu-latest

    steps:
      - name: Download release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.release_sha }}

      - name: Read short description
        id: description
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          description = Path("description.txt").read_text(
              encoding="utf-8"
          ).strip()

          if not description or "\n" in description or "\r" in description:
              raise ValueError("Description must be one non-empty line")

          if len(description) > 100:
              raise ValueError("Description must not exceed 100 characters")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"text={description}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-pipeline:v${{ needs.version.outputs.new_version }}

      - name: Update Docker Hub description and README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/devops-pipeline
          short-description: ${{ steps.description.outputs.text }}
          readme-filepath: README.md

      - name: Add dockerhub label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const name = "dockerhub";

            try {
              await github.rest.issues.getLabel({
                owner, repo, name
              });
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color: "2496ED",
                description: "Image published and Docker Hub information updated"
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [name]
            });

  telegram:
    name: Notify Telegram
    needs: [version, changelog, dockerhub]
    runs-on: ubuntu-latest

    steps:
      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: release-files

      - name: Prepare release message
        env:
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
          RELEASE_SHA: ${{ needs.changelog.outputs.release_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          pr = event["pull_request"]
          repository = os.environ["GITHUB_REPOSITORY"]
          project = repository.split("/", 1)[1]
          version = os.environ["NEW_VERSION"]
          owner = os.environ["DOCKERHUB_USERNAME"]
          sha = os.environ["RELEASE_SHA"]
          server = os.environ["GITHUB_SERVER_URL"]

          repo_url = f"{server}/{repository}"
          image = f"{owner}/{project}:v{version}"
          docker_url = f"https://hub.docker.com/r/{owner}/{project}"
          tags_url = f"{docker_url}/tags?name=v{version}"
          commit_url = f"{repo_url}/commit/{sha}"
          run_url = f"{repo_url}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          def escape(value):
              return html.escape(str(value), quote=True)

          def link(url, text):
              return f'<a href="{escape(url)}">{escape(text)}</a>'

          message = "\n".join([
              "Новый выпуск приложения",
              f"Проект: {link(repo_url, project)}",
              f"Версия: {escape(version)}",
              f"Дата: {date}",
              f"Автор PR: {link(pr['user']['html_url'], pr['user']['login'])}",
              "",
              "Информация о Git-репозитории",
              f"PR: {link(pr['html_url'], '#' + str(pr['number']))}",
              f"Ветка: {escape(pr['head']['ref'])}",
              f"Коммит выпуска: {link(commit_url, sha[:7])}",
              f"Pipeline: {link(run_url, 'Открыть запуск')}",
              "",
              "Информация о Docker-репозитории",
              f"Владелец: {escape(owner)}",
              f"Название: {link(docker_url, project)}",
              f"Тег: {link(tags_url, 'v' + version)}",
              f"Полное имя: {escape(image)}"
          ])

          Path("telegram-message.txt").write_text(message, encoding="utf-8")
          PY

      - name: Send release message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --silent --show-error --fail \
            --connect-timeout 15 \
            --max-time 60 \
            --output /tmp/telegram-message-response.json \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text@telegram-message.txt" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

          echo "Release message sent."

      - name: Send changelog document
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          curl --silent --show-error --fail \
            --connect-timeout 15 \
            --max-time 60 \
            --output /tmp/telegram-document-response.json \
            --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "caption=Changelog for v$NEW_VERSION" \
            --form "document=@release-files/changelog.md" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

          echo "Changelog document sent."

  deploy:
    name: Deploy
    needs: [version, changelog, telegram]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.new_version }}
      release_sha: ${{ needs.changelog.outputs.release_sha }}