name: Security

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  antivirus:
    name: Antivirus — ClamAV
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Scan repository for malware
        uses: djdefi/gitavscan@v23

  sast:
    name: Python security — Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan application code
        run: bandit app.py

  lint:
    name: Python lint — Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check application code
        run: ruff check app.py

  label:
    name: Add sec-passed label
    needs: [antivirus, sast, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Create and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const name = "sec-passed";

            try {
              await github.rest.issues.getLabel({
                owner, repo, name
              });
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color: "0E8A16",
                description: "All security checks passed"
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [name]
            });